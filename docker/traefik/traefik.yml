# Traefik Static Configuration
# PULSE Reverse Proxy — Development

# API / Dashboard
api:
  dashboard: true
  # SEC-24: never serve the dashboard API unauthenticated. The dashboard is
  # reachable only through an explicitly configured authenticated router;
  # there is no insecure catch-all listener.
  insecure: false

# Entrypoints
entryPoints:
  web:
    address: ":80"

# File provider — dynamic routing configs written by backend
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Logging
log:
  level: DEBUG

accessLog: {}
