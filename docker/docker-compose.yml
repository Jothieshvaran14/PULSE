services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ryme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ryme}
      # Fallback is a local-only placeholder, not a credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ryme}
    ports:
      # SEC-23: loopback-only bind — the dev database is not reachable from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ryme}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Traefik — Reverse proxy for deployed applications
  # ---------------------------------------------------------------------------
  # Traefik uses the Docker provider to auto-discover containers with labels.
  # It does NOT proxy the PULSE backend/frontend — only user-deployed apps.
  traefik:
    image: traefik:v3.3
    container_name: ryme-traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      # HTTP entrypoint for deployed apps (*.localhost)
      - "80:80"
      # Traefik dashboard port (development only). SEC-24: loopback-bound and
      # inert while api.insecure is false; kept for explicit local debugging.
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - ryme-network

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
# All deployed containers join this network so Traefik can route to them.
# The PULSE backend creates containers on this network via dockerode.
networks:
  ryme-network:
    name: ryme-network
    driver: bridge
